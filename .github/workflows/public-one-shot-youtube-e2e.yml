name: One-shot public YouTube upload E2E

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/public-one-shot-youtube-e2e.yml"

permissions:
  contents: read

jobs:
  upload-one:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: video-worker/requirements.txt

      - name: Verify required secrets exist
        env:
          DRIVE_OK: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          YT_ID_OK: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YT_SECRET_OK: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YT_REFRESH_OK: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        shell: bash
        run: |
          test -n "$DRIVE_OK"
          test -n "$YT_ID_OK"
          test -n "$YT_SECRET_OK"
          test -n "$YT_REFRESH_OK"
          echo "All required secrets are configured."

      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          pip install -r video-worker/requirements.txt

      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs voicevox
          exit 1

      - name: Render and upload one long video
        working-directory: video-worker
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

          SCHEDULED_LONG_FOLDER_ID: "1cmYcKgmQhj-LesauZ92BCS4-mC44fUBP"
          SCHEDULED_DONE_FOLDER_ID: "12F-_M0xRuCnjqs6xQ-plTYWOa3LAsBIV"
          SCHEDULED_ERROR_FOLDER_ID: "12mzxgiCEsZdBQxvz-Uso-0Ozzrqol_HI"

          DRY_RUN: "false"
          MAX_ATTEMPTS: "3"
          DOG_JOB_LIMIT: "0"
          MBTI_JOB_LIMIT: "0"
          CAT_JOB_LIMIT: "0"
          LONG_JOB_LIMIT: "1"
          PUBLISH_DAYS_AHEAD: "1"
          LONG_PUBLISH_SLOTS: "20:30"
          LONG_VOICE_SPEED: "1.25"
          VOICEVOX_SPEAKER_NAME: "ずんだもん"
          VOICEVOX_STYLE_NAME: "ノーマル"
          CTA_ENABLED: "false"
        run: python public_worker.py
