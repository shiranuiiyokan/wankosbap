name: One-time v2 production-worker smoke

on:
  push:
    branches: ["v2-hybrid-rollout-20261002"]
    paths:
      - "video-worker-v2/production_smoke_trigger.txt"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          pip install -r video-worker-v2/requirements.txt
      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs voicevox
          exit 1
      - name: Run locked worker against legacy DOG read-only
        working-directory: video-worker-v2
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SCHEDULED_DOG_FOLDER_ID: "1tS_bBKMPmmqXq-ROYi9PvgYI2wit9FgZ"
          CATEGORY_ALLOWLIST: "dog"
          V2_PUBLISH_ENABLED: "false"
          V2_MAX_UPLOADS_PER_RUN: "1"
          DOG_JOB_LIMIT_V2: "1"
          SHORT_VOICE_SPEED_V2: "1.45"
        run: python production_worker.py
