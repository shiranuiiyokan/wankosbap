name: One-shot Actions storage cleanup

on:
  push:
    paths:
      - ".github/workflows/storage-cleanup-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "/repos/$REPO/actions/artifacts?per_page=100" --jq '.artifacts[].id' |
          while read -r id; do
            [ -z "$id" ] || gh api --method DELETE "/repos/$REPO/actions/artifacts/$id"
          done

      - name: Delete all Actions caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "/repos/$REPO/actions/caches?per_page=100" --jq '.actions_caches[].id' |
          while read -r id; do
            [ -z "$id" ] || gh api --method DELETE "/repos/$REPO/actions/caches/$id"
          done
