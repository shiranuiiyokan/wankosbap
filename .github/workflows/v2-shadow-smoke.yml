name: One-time v2 shadow smoke

on:
  push:
    branches: ["v2-parallel-shadow-20261002"]
    paths:
      - "video-worker-v2/shadow_trigger.txt"

permissions:
  contents: read

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          pip install -r video-worker-v2/requirements.txt
      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs voicevox
          exit 1
      - name: Read-only LONG preflight
        working-directory: video-worker-v2
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SCHEDULED_LONG_FOLDER_ID: "1cmYcKgmQhj-LesauZ92BCS4-mC44fUBP"
          V2_CATEGORY: "long"
          V2_PROJECT_FILTER: "LONG-NAME-001"
          V2_PREFLIGHT_ONLY: "true"
          V2_STRICT_QC: "false"
          V2_MIN_FREE_GB: "4"
          LONG_VOICE_SPEED_V2: "1.20"
        run: python shadow_worker.py
