name: Public video production worker

on:
  push:
    branches: [main]
    paths:
      - "video-worker/**"
      - ".github/workflows/public-video-production.yml"
  schedule:
    - cron: "0 12 * * *" # 21:00 JST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only; do not upload to YouTube or move Drive folders"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile video-worker/*.py

  credential-gate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          DRIVE_OK: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          YT_ID_OK: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YT_SECRET_OK: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YT_REFRESH_OK: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        shell: bash
        run: |
          if [ -n "$DRIVE_OK" ] && [ -n "$YT_ID_OK" ] && [ -n "$YT_SECRET_OK" ] && [ -n "$YT_REFRESH_OK" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "All production credentials are configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Production skipped: one or more required repository secrets are missing."
          fi

  produce:
    if: needs.credential-gate.outputs.ready == 'true'
    needs: [validate, credential-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: video-worker/requirements.txt

      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          pip install -r video-worker/requirements.txt

      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs voicevox
          exit 1

      - name: Render and upload directly to YouTube
        working-directory: video-worker
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

          SCHEDULED_DOG_FOLDER_ID: "1tS_bBKMPmmqXq-ROYi9PvgYI2wit9FgZ"
          SCHEDULED_MBTI_FOLDER_ID: "16tZkJMMCYbMiugO5pWfEeyvA5fGHXvR0"
          SCHEDULED_CAT_FOLDER_ID: "1F2Dp0uhLNKbLcxDUatOz0QhJDnsabR8o"
          SCHEDULED_LONG_FOLDER_ID: "1cmYcKgmQhj-LesauZ92BCS4-mC44fUBP"
          SCHEDULED_DONE_FOLDER_ID: "12F-_M0xRuCnjqs6xQ-plTYWOa3LAsBIV"
          SCHEDULED_ERROR_FOLDER_ID: "12mzxgiCEsZdBQxvz-Uso-0Ozzrqol_HI"

          DRY_RUN: ${{ inputs.dry_run }}
          MAX_ATTEMPTS: "3"
          DOG_JOB_LIMIT: "3"
          MBTI_JOB_LIMIT: "3"
          CAT_JOB_LIMIT: "3"
          LONG_JOB_LIMIT: "1"
          PUBLISH_DAYS_AHEAD: "1"
          DOG_PUBLISH_SLOTS: "09:30,13:00,19:00"
          MBTI_PUBLISH_SLOTS: "08:00,15:30,21:00"
          CAT_PUBLISH_SLOTS: "10:30,17:00,22:00"
          LONG_PUBLISH_SLOTS: "20:30"
          SHORTS_VOICE_SPEED: "1.65"
          LONG_VOICE_SPEED: "1.25"
          VOICEVOX_SPEAKER_NAME: "ずんだもん"
          VOICEVOX_STYLE_NAME: "ノーマル"
          CTA_ENABLED: "true"
          CTA_DURATION: "1.2"
          CTA_TEXT: "ペットとツーショット撮るなら、WANKO SNAP。"
          CTA_SUBTEXT: "プロフィールから"
        run: python public_worker.py
